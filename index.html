<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Konverter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
    <style>
    *, html, body {
        padding: 0;
        margin: 0;
        font-family: 'Poppins', sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .container {
        width: 100% ;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #15202B;
    }

    .judul {
        margin-bottom: 24px;
        scale: 150%;
        background-color: #CD3333;
        padding: 0 15px;
        box-shadow: 15px 15px 0px 0px #000000;
    }

    .input-section,
    .output-section {
        display: flex;
        margin-top: 48px;
    }

    .luas-input,
    .luas-output {
        font-size: 2em;
        font-weight: 600;
    }

    input[type="text"],
    input[type="number"] {
        margin-right: 48px;
        width: 324px;
        height: 64px;
        font-size: 40px;
        box-shadow: 15px 15px 0px 0px #000000;
        text-align: center;
    }

    .satuan {
        display: flex;
        align-items: flex-end;
    }

    .are,
    .m2 {
        color: black;
        font-size: 48px;
        font-weight: 600;
        background-color: white;
        width: 150px;
        height: 64px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        box-shadow: 15px 15px 0px 0px #000000;
        margin-right: 24px;
    }

    button {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        width: 100%;
        height: 100%;
    }

    button:hover {
        background-color: #CD3333;
        color: white;
    }
    </style>
</head>
<body>
    <div class="container">
    <div class="judul">
        <h1>KONVERSI LUAS ARE & M<sup>2</sup></h1>
    </div>

    <div class="input-section">
        <div class="luas-input">
        <p>Luas</p>
        <input type="number" id="inputLuas">
    </div>
    <div class="satuan">
        <div class="are">
            <button onclick="hitungAre()">are</button>
        </div>
        <div class="m2">
            <button onclick="hitungM2()">m<sup>2</sup></button>
        </div>
        </div>
    </div>

    <div class="output-section">
      <div class="luas-output">
        <p>Hasil</p>
        <input type="text" id="outputLuas" readonly>
      </div>
      <div class="satuan">
        <div class="are" style="display: none; background-color: #CD3333; color: white;" id="are">
          <p>are</p>
        </div>
        <div class="m2" style="display: none; background-color: #CD3333; color: white;" id="m2">
          <p>m<sup>2</sup></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const inputLuas = document.getElementById("inputLuas");
    const outputLuas = document.getElementById("outputLuas");
    const are = document.getElementById("are");
    const m2 = document.getElementById("m2");

    
    function hitungAre(){
        let luas = inputLuas.value;
        outputLuas.value = luas * 100;
        m2.style.display = "block";
        are.style.display = "none";
    }

    function hitungM2(){
        let luas = inputLuas.value;
        outputLuas.value = luas / 100;
        m2.style.display = "none";
        are.style.display = "block";
    }



  </script>
</body>
</html>
